# panel-metrics on docker2.
#
# Secrets are mounted read-only from files on the host, never passed as environment
# variables or build arguments: both end up in `docker inspect` output.

services:
  panel-metrics:
    build:
      context: ../..
      dockerfile: linux/phase3/Dockerfile
    container_name: panel-metrics
    restart: unless-stopped
    ports:
      # Reachable from pve-nas, where aster-prom scrapes it.
      - "9101:9101"
    volumes:
      - ./config.toml:/etc/panel-metrics/config.toml:ro
      # Secrets live in ./secrets beside this file, so the whole deployment is one
      # directory that can be moved or backed up as a unit. Keep that directory
      # 0700 and its contents 0600 — the bind mount preserves host permissions.
      - ./secrets/truenas-readonly.key:/run/secrets/truenas.key:ro
      - ./secrets/kuma-panel-metrics.key:/run/secrets/kuma.key:ro
      - ./secrets/opnsense-key:/run/secrets/opnsense.id:ro
      - ./secrets/opnsense-secret:/run/secrets/opnsense.key:ro
      - ./secrets/hass.key:/run/secrets/hass.key:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
