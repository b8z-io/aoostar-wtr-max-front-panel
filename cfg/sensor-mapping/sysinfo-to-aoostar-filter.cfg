# Filter for the sensor file whose name matches this one without the `-filter` suffix.
#
# One regular expression per line, matched against the full sensor key.
# Empty lines and lines starting with # are ignored.
#
#   pattern     drop any key that matches
#   !pattern    KEEP only keys that match — when any `!` line is present, a key
#               must match one of them to survive
#
# Keep patterns are applied first, then drop patterns to whatever remains, so
# the two combine: keep a subset, then trim unwanted keys within it.
#
# A file with no `!` lines behaves exactly as it always has: a plain denylist.
#
# Sensor filter for: aster-sysinfo

# remove all temperature sensor units
^temperature_.*#unit
